name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }} - Linters & Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python, dependencies and project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run ruff check
        run: uv run ruff check src/ test/

      - name: Run mypy
        run: uv run mypy src/ test/

      - name: Run ty
        run: uv run ty check src/ test/

      - name: Run pyright
        run: uv run pyright src/ test/

      - name: Run pyrefly
        run: uv run pyrefly check src/ test/

      - name: Run slotscheck
        run: uv run slotscheck src/

      - name: Run tests
        run: uv run pytest
