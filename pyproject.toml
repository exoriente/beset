[project]
name = "beset"
version = "0.1.0"
description = "Immutable, typed intervals as sets"
readme = "readme.md"
authors = [
    { name = "Maarten Oosten", email = "oosten@gmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
lint = [
    "ruff>=0.16.5",
]
type-check = [
    "mypy>=2.3.1",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "ty>=0.0.75",
]
test = [
    "pytest>=9.1.1",
]
coverage = [
    "pytest-cov>=7.1.0",
    {include-group = "test"},
]
slotscheck = [
    "slotscheck>=0.20.1",
]
dev = [
    {include-group = "lint"},
    {include-group = "type-check"},
    {include-group = "test"},
    {include-group = "coverage"},
    {include-group = "slotscheck"},
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.pyrefly]
preset = "strict"

[tool.pyrefly.errors]
unused-ignore = false
missing-override-decorator = false

[tool.coverage.run]
omit = ["test/*"]
