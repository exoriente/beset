[project]
name = "beset"
version = "0.1.1"
description = "Immutable, typed intervals as sets"
readme = "readme.md"
authors = [
    { name = "Maarten Oosten", email = "oosten@gmail.com" }
]
license = "MIT"
license-files = ["license"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python",
    "Typing :: Typed",
]
keywords = [
    "interval", "typesafe", "set", "range", "period", "bound", "open",
    "closed", "half-open", "bounded", "unbounded", "subset", "span",
    "continuous", "intersection", "union", "generic",
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.16.0 ; python_full_version < '3.11'",
]

[dependency-groups]
lint = [
    "ruff>=0.16.5",
]
type-check = [
    "mypy>=2.3.1",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "ty>=0.0.75",
]
test = [
    "pytest>=9.1.1",
]
coverage = [
    "pytest-cov>=7.1.0",
    {include-group = "test"},
]
slotscheck = [
    "slotscheck==0.21.0b1",
]
dev = [
    {include-group = "lint"},
    {include-group = "type-check"},
    {include-group = "test"},
    {include-group = "coverage"},
    {include-group = "slotscheck"},
]

[project.urls]
Homepage = "https://github.com/exoriente/beset"
Repository = "https://github.com/exoriente/beset"
Issues = "https://github.com/exoriente/beset/issues"


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.pyrefly]
preset = "strict"

[tool.pyrefly.errors]
unused-ignore = false
missing-override-decorator = false

[tool.coverage.run]
omit = ["test/*"]
